version: '3.8'

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "network.host=0.0.0.0"
      - "discovery.type=single-node"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - wazuh-net

  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    hostname: wazuh.manager
    restart: unless-stopped
    ports:
      - "1514:1514/tcp"   # Agent secure connection
      - "1515:1515/tcp"   # Agent enrollment
      - "514:514/udp"     # Syslog listener
      - "55000:55000/tcp" # Wazuh RESTful API
    environment:
      - INDEXER_URL=http://wazuh.indexer:9200
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - ../configs/manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ../configs/manager/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
      - ../active-response/quarantine_file.sh:/var/ossec/active-response/bin/quarantine_file.sh:ro
    depends_on:
      - wazuh.indexer
    networks:
      - wazuh-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "443:5601"
    environment:
      - INDEXER_URL=http://wazuh.indexer:9200
      - WAZUH_API_URL=https://wazuh.manager:55000
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - wazuh-net

  monitored.endpoint:
    image: ubuntu:22.04
    hostname: ubuntu-target-endpoint
    restart: unless-stopped
    command: >
      bash -c "apt-get update && apt-get install -y curl auditd inotify-tools python3 &&
               echo 'Target endpoint ready for Wazuh agent enrollment' &&
               tail -f /dev/null"
    networks:
      - wazuh-net

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:

networks:
  wazuh-net:
    driver: bridge
