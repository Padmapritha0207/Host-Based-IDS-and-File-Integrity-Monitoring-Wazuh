<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>127.0.0.1</smtp_server>
    <email_from>wazuh@security-lab.local</email_from>
    <email_to>soc-alerts@security-lab.local</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_summary>12</email_log_summary>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>192.168.1.0/24</white_list>
    <white_list>172.16.0.0/12</white_list>
  </global>

  <!-- Remote agent communication service -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Ruleset Configuration -->
  <ruleset>
    <!-- Default Wazuh rules and decoders -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>

    <!-- Custom Decoders and Rules for Lab -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- Manager Syscheck Engine (FIM Aggregation & Alerting) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- Maximum files allowed in database -->
    <max_files_per_scan>100000</max_files_per_scan>

    <!-- Database synchronization between agent and manager -->
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_interval>1h</max_interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Active Response Command Definitions -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>quarantine-file</name>
    <executable>quarantine_file.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- Active Response Automated Triggers -->
  <!-- 1. Block attacker IP after SSH brute force -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712, 100020</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- 2. Quarantine web shells and unauthorized executable drops -->
  <active-response>
    <command>quarantine-file</command>
    <location>local</location>
    <rules_id>100011</rules_id>
  </active-response>

  <!-- Logging & Alert Thresholds -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>
</ossec_config>
