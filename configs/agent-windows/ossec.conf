<!--
  Wazuh Agent Configuration for Monitored Windows Endpoint
  Project: Host-based IDS & File Integrity Monitoring Lab
-->
<ossec_config>
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows-server, win11</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- File Integrity Monitoring (Syscheck) for Windows -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- 1. Critical System Directories (ReadDirectoryChangesW Real-time) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\inetpub\wwwroot</directories>
    <directories check_all="yes" realtime="yes">C:\canaries</directories>

    <!-- 2. Windows Registry Integrity Monitoring -->
    <!-- Detects Run / RunOnce Autostart persistence mechanisms -->
    <windows_registry check_all="yes">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry check_all="yes">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry check_all="yes">HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry check_all="yes">HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>

    <!-- Detects malicious Windows service installations -->
    <windows_registry check_all="yes">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>

    <!-- 3. Ignored noisy paths -->
    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Users\*\AppData\Local\Temp</ignore>
  </syscheck>

  <!-- Windows Event Channel Log Collection -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Microsoft Sysmon Integration (Advanced Process & File Activity) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</ossec_config>
