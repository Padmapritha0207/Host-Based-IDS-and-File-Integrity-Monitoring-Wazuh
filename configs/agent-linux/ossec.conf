<!--
  Wazuh Agent Configuration for Monitored Linux Endpoint
  Project: Host-based IDS & File Integrity Monitoring Lab
-->
<ossec_config>
  <client>
    <server>
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, debian, linux</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- File Integrity Monitoring (Syscheck) Configuration -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore>no</auto_ignore>
    <alert_new_files>yes</alert_new_files>

    <!-- 1. Critical System Configuration Directories (Real-time & Unified Diff) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes" realtime="yes">/bin</directories>
    <directories check_all="yes" realtime="yes">/sbin</directories>
    <directories check_all="yes" realtime="yes">/usr/bin</directories>
    <directories check_all="yes" realtime="yes">/usr/sbin</directories>

    <!-- 2. Web Application Directories (Real-time & Auditd Whodata enabled) -->
    <!-- Whodata records: Process Name, PID, User, and Command executed -->
    <directories check_all="yes" realtime="yes" whodata="yes">/var/www/html</directories>

    <!-- 3. User Identity & SSH Keys Monitored with Whodata -->
    <directories check_all="yes" realtime="yes" whodata="yes">/root/.ssh</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/home/*/.ssh</directories>

    <!-- 4. Decoy Canary / Tripwire Honeypot Directory -->
    <directories check_all="yes" realtime="yes">/var/canaries</directories>

    <!-- 5. Sensitive File Masking (DO NOT store plaintext hash diffs of credentials) -->
    <nodiff>/etc/shadow</nodiff>
    <nodiff>/etc/gshadow</nodiff>
    <nodiff>/etc/ssl/private</nodiff>

    <!-- 6. Ignore Volatile & Temporary Dynamic Files to Suppress False Positives -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/etc/motd</ignore>
    <ignore type="sregex">^/var/log/</ignore>
    <ignore type="sregex">^/tmp/</ignore>
    <ignore type="sregex">^/var/tmp/</ignore>
  </syscheck>

  <!-- Rootkit and Trojan Detection (Rootcheck) -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_interfaces>yes</check_interfaces>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- Log Collection (HIDS Ingestion) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
</ossec_config>
